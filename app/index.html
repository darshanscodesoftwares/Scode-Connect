<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#2047d7" />
    <meta
      name="description"
      content="Scode's internship enquiry and batch management workspace."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ScodeConnect</title>
    <link rel="icon" href="./assets/scodeconnect-logo-only.png" />
    <link rel="apple-touch-icon" href="./assets/scodeconnect-logo-only.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a href="#content" class="skip">Skip to content</a>
    <div id="app">
      <main class="startup" aria-busy="true" aria-live="polite">
        <div class="launch-content">
          <div id="launch-loader" aria-hidden="true">
            <span class="launch-fallback"></span>
          </div>
          <p>Opening ScodeConnect</p>
          <span
            class="launch-progress"
            role="progressbar"
            aria-label="Loading"
          ></span>
        </div>
      </main>
    </div>
    <dialog id="dialog"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="./vendor/lottie.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
